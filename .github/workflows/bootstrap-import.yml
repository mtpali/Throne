name: Bootstrap Throne source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-upstream:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream development branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f CMakeLists.txt ]; then
            echo "Source is already imported."
            exit 0
          fi
          git clone --depth 1 --branch dev https://github.com/throneproj/Throne.git upstream
          rsync -a --exclude=.git --exclude=.github/workflows upstream/ ./
          rm -rf upstream
          rm -f .github/workflows/bootstrap-import.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import Throne dev as MobileTina Windows base"
          git push origin main
